name: Build APK

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  FLUTTER_VERSION: '3.22.0'
  JAVA_VERSION: '17'

jobs:
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      STORAGE_PATH: /tmp/f2t_storage
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1 libmagic1 libmagic-dev
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov
          pip install numpy scipy soundfile
          pip install pydantic pydantic-settings python-dotenv
          pip install structlog python-magic
      - name: Create storage dirs
        run: mkdir -p /tmp/f2t_storage/{uploads,stems,output,temp}
      - name: Run tests
        run: |
          pytest tests/test_security.py tests/test_generator.py tests/test_analyzer.py \
            -v --tb=short \
            -k "not slow and not integration" || true

  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android_app
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Generate code
        run: flutter pub run build_runner build --delete-conflicting-outputs || true
      - name: Analyze
        run: flutter analyze --no-fatal-infos || true
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flamenco2techno-debug-apk
          path: android_app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

  build-backend:
    name: Build Backend Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: backend
          push: false
          tags: flamenco2techno-api:latest
          target: deps
          cache-from: type=gha
          cache-to: type=gha,mode=max
